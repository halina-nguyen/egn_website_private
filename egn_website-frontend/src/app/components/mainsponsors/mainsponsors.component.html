<div class="background">
  <div class="sponsor-banner">

    <p class="lp-headline">Unsere Sponsoren</p>
    <div class="lp-sep"></div>
    <div class="sponsor-banner__row">
      <div class="sponsor-banner__grid">

      <a class="sponsor-card" href="supporters/{{current_year}}#Royal%20First%20Class%20Partner">
          <img src="assets/images/sponsors/RFCP/vw_logo.png" alt="Volkswagen" class="sponsor-card__icon">
        <span class="sponsor-card__tier sponsor-card__tier--featured">{{ 'mainsponsor.royal_partner' | translate }}</span>
      </a>

      <a class="sponsor-card" href="supporters/{{current_year}}#Royal%20First%20Class%20Partner">
        <img src="assets/images/sponsors/RFCP/nxp_logo.png" alt="NXP" class="sponsor-card__icon">
        <span class="sponsor-card__tier sponsor-card__tier--featured">{{ 'mainsponsor.royal_partner' | translate }}</span>
      </a>

      <a class="sponsor-card" href="/supporters/university">
        <img src="assets/images/sponsors/hochschulpartner/tuhh_logo.png" alt="TUHH" class="sponsor-card__icon">
        <span class="sponsor-card__tier sponsor-card__tier--featured sponsor-card__tier--university">{{ 'mainsponsor.university_partner' | translate }}</span>
      </a>

      </div>

      <a class="sponsor-more-button" routerLink="/supporters">
        {{ 'mainsponsor.more_partners' | translate }}
      </a>
    </div>

    <p class="sponsor-banner__footer">
      <span>{{ 'mainsponsor.contact' | translate }}</span>
      <a class="sponsor-contact-button" routerLink="/kontakt">{{ 'mainsponsor.contact_button' | translate }}</a>
    </p>

  </div>
</div>
